<!DOCTYPE html>
<html lang="id" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Login - Portal HRIS Premium</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .glass { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.1); }
  </style>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md glass rounded-3xl p-8 shadow-2xl">
    <div class="text-center mb-8">
      <h2 class="text-3xl font-extrabold bg-gradient-to-r from-blue-400 to-purple-500 bg-clip-text text-transparent">ABSENSI</h2>
      <p class="text-slate-400 text-sm mt-1">Made By Tanz</p>
    </div>

    <form id="loginForm" class="space-y-5">
      <div>
        <label class="block text-xs uppercase text-slate-400 font-semibold mb-2">Username</label>
        <input type="text" id="username" required class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div>
        <label class="block text-xs uppercase text-slate-400 font-semibold mb-2">Password</label>
        <input type="password" id="password" required class="w-full px-4 py-3 rounded-xl bg-slate-900 border border-slate-800 text-sm focus:outline-none focus:border-indigo-500">
      </div>
      <div class="flex justify-between text-xs text-slate-400">
        <a href="/register" class="hover:text-indigo-400">Daftar Akun Baru</a>
        <span>Lupa Password? Hubungi Admin</span>
      </div>
      <button type="submit" class="w-full py-3.5 bg-gradient-to-r from-blue-600 to-purple-600 rounded-xl font-bold shadow-lg shadow-indigo-500/30 hover:opacity-90">Login</button>
    </form>
  </div>

  <script>
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const res = await fetch('/api/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: e.target.username.value, password: e.target.password.value })
      });
      const data = await res.json();
      if (data.success) {
        window.location.href = data.user.role.includes('Admin') ? '/admin' : '/dashboard';
      } else {
        alert(data.message);
      }
    });
  </script>
</body>
</html>
