<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pendaftaran Akun</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-white min-h-screen flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-slate-900 border border-slate-800 rounded-3xl p-8 shadow-2xl">
    <h2 class="text-2xl font-bold text-center mb-6">Pendaftaran Akun Baru</h2>
    <form id="regForm" class="space-y-4">
      <input type="text" name="fullName" placeholder="Nama Lengkap" required class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm">
      <input type="text" name="username" placeholder="Username" required class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm">
      <input type="text" name="phone" placeholder="Nomor HP" required class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm">
      <input type="text" name="position" placeholder="Jabatan" required class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm">
      <input type="password" name="password" placeholder="Password" required class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm">
      <input type="password" name="confirmPassword" placeholder="Konfirmasi Password" required class="w-full px-4 py-2.5 rounded-xl bg-slate-800 border border-slate-700 text-sm">
      <div>
        <label class="block text-xs text-slate-400 mb-1">Foto Profil</label>
        <input type="file" name="profilePicture" accept="image/*" class="w-full text-xs text-slate-400">
      </div>
      <button type="submit" class="w-full py-3 bg-blue-600 rounded-xl font-bold">Daftar Sekarang</button>
      <a href="/" class="block text-center text-xs text-slate-400 mt-2">Sudah punya akun? Login</a>
    </form>
  </div>

  <script>
    document.getElementById('regForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const formData = new FormData(e.target);
      const res = await fetch('/api/auth/register', { method: 'POST', body: formData });
      const data = await res.json();
      alert(data.message);
      if (data.success) window.location.href = '/';
    });
  </script>
</body>
</html>
